<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinWise AI - Platform Authentication</title>
    
    <!-- SEO Elements -->
    <meta name="description" content="FinWise AI authentication portal. Access the next-generation AI Loan Eligibility Checker and credit advisory co-pilot.">
    <meta name="author" content="FinWise AI">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS imports -->
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/hero.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/animations.css">
</head>
<body>

    <!-- Authentication Gate Card -->
    <section class="login-section" id="login-section">
        <div class="grid-overlay"></div>
        <div class="glow-sphere sphere-primary"></div>
        <div class="glow-sphere sphere-accent"></div>
        
        <div class="login-card glass-card">
            <div class="login-header">
                <div class="nav-logo">
                    <div class="logo-glow"></div>
                    <i class="fa-solid fa-brain-circuit logo-icon"></i>
                    <span class="logo-text">FinWise <span class="accent-text">AI</span></span>
                </div>
                <h2>Platform Authentication</h2>
                <p>Intelligent Financial Assessment & Credit Analysis Platform</p>
            </div>
            
            <form id="login-form" class="dashboard-form">
                <div class="form-group">
                    <label for="login-email">Corporate Email</label>
                    <input type="email" id="login-email" class="form-input" placeholder="e.g. admin@finwise.ai" required>
                </div>
                
                <div class="form-group">
                    <label for="login-password">Security Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="login-password" class="form-input" placeholder="••••••••" required>
                        <button type="button" class="btn-toggle-visibility" onclick="togglePasswordVisibility('login-password')" aria-label="Toggle Password visibility">
                            <i class="fa-solid fa-eye" id="login-password-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group checkbox-group">
                    <input type="checkbox" id="login-remember" checked>
                    <label for="login-remember">Keep me authenticated for 7 days</label>
                </div>
                
                <button type="submit" class="btn btn-primary btn-block" id="btn-login-submit">
                    <i class="fa-solid fa-right-to-bracket"></i>
                    <span>Authenticate Security Keys</span>
                </button>
            </form>
            
            <div class="demo-login-hint">
                <i class="fa-solid fa-circle-info"></i>
                <span>Demo Access: <code class="accent-text">admin@finwise.ai</code> / <code class="accent-text">admin123</code></span>
            </div>
        </div>
    </section>

    <!-- Toast alerts -->
    <div class="toast-container" id="toast-wrapper"></div>

    <!-- Script references -->
    <script src="data/constants.js"></script>
    <script src="js/app.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
